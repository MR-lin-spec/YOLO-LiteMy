# Ultralytics YOLOLite 🚀

task: detect  # (str) YOLO 任务类型，例如 detect（检测）
mode: train  # (str) YOLO 模式，例如 train（训练）、val（验证）、predict（预测）

# 训练设置 -------------------------------------------------------------------------------------------------------
model:  # (str, optional) 模型文件路径，例如 yolov8n.pt、yolov8n.yaml
data:  # (str, optional) 数据文件路径，例如 coco8.yaml
unlabeldata:  # (str, optional) 无标签数据文件路径，例如 coco8_unlabel.yaml
epochs: 100  # (int) 训练的总周期数
time:  # (float, optional) 训练时间（小时），如果提供则覆盖 epochs
patience: 150 # (int) 在没有可观察改进时，提前停止训练的等待周期数
batch: 16  # (int) 每批次图像数量（-1 表示自动批量）
imgsz: 640  # (int | list) 输入图像大小，训练和验证模式下为整数，预测和导出模式下为列表[h, w]
save: True  # (bool) 是否保存训练检查点和预测结果
save_period: -1  # (int) 每 x 个周期保存一次检查点（小于 1 时禁用）
device:  # (int | str | list, optional) 运行设备，例如 cuda device=0 或 device=0,1,2,3 或 device=cpu
workers: 8  # (int) 数据加载的工作线程数（每个 RANK 如果使用 DDP）
project:  # (str, optional) 项目名称
name:  # (str, optional) 实验名称，结果保存到 'project/name' 目录
exist_ok: False  # (bool) 是否覆盖现有实验
pretrained: True  # (bool | str) 是否使用预训练模型（布尔值）或加载权重的模型（字符串）
optimizer: auto  # (str) 使用的优化器，选择项=[SGD, Adam, Adamax, AdamW, NAdam, RAdam, RMSProp, auto]
verbose: True  # (bool) 是否打印详细输出
seed: 0  # (int) 随机种子，用于可复现性
deterministic: True  # (bool) 是否启用确定性模式
single_cls: False  # (bool) 将多类数据作为单类进行训练
rect: False  # (bool) 如果模式为 'train' 则为矩形训练，模式为 'val' 则为矩形验证
cos_lr: True  # (bool) 是否使用余弦学习率调度
close_mosaic: 20  # (int) 在最后的周期禁用马赛克增强（0 表示禁用）
resume: False  # (bool) 从最后的检查点恢复训练
amp: False  # (bool) 自动混合精度（AMP）训练，选择项=[True, False]，True 表示运行 AMP 检查
profile: False  # (bool) 在训练期间记录 ONNX 和 TensorRT 的速度以供日志使用
freeze: 11  # (int | list, optional) 冻结前 n 层，或在训练期间冻结层索引列表 []
multi_scale: False  # (bool) 是否在训练期间使用多尺度
# 在 Train settings 区域添加以下参数
cache: False  # (bool | str) 图像缓存到RAM(True/'ram')或磁盘('disk')加速数据加载
fraction: 1.0  # (float) 训练数据集使用比例 (1.0=全部)
compile: False  # (bool | str) 启用torch.compile()后端='inductor'

# 验证/测试设置 ----------------------------------------------------------------------------------------------------
val: True  # (bool) 在训练期间进行验证/测试
split: val  # (str) 用于验证的数据集拆分，例如 'val'、'test' 或 'train'
save_json: False  # (bool) 是否将结果保存为 JSON 文件
save_hybrid: False  # (bool) 是否保存标签的混合版本（标签 + 额外预测）
conf:  # (float, optional) 检测的对象置信度阈值（默认 0.25 预测，0.001 验证）
iou: 0.7  # (float) 非最大抑制（NMS）的交并比（IoU）阈值
max_det: 300  # (int) 每张图像的最大检测数量
half: False  # (bool) 是否使用半精度（FP16）
dnn: False  # (bool) 是否使用 OpenCV DNN 进行 ONNX 推理
plots: True  # (bool) 在训练/验证期间是否保存图形和图像
end2end: True # (bool, optional) 是否使用端到端头 (YOLO26/YOLOv10)

# 预测设置 -----------------------------------------------------------------------------------------------------
source:  # (str, optional) 图像或视频的源目录
vid_stride: 1  # (int) 视频帧率步幅
stream_buffer: False  # (bool) 缓冲所有流媒体帧（True）或返回最新帧（False）
visualize: False  # (bool) 是否可视化模型特征
augment: False  # (bool) 是否对预测源应用图像增强
agnostic_nms: False  # (bool) 类无关的 NMS
classes:  # (int | list[int], optional) 按类别过滤结果，例如 classes=0，或 classes=[0,2,3]
embed:  # (list[int], optional) 从给定层返回特征向量/嵌入

# 可视化设置 ---------------------------------------------------------------------------------------------------
show: False  # (bool) 如果环境允许，是否显示预测的图像和视频
save_frames: False  # (bool) 是否保存预测的单个视频帧
save_txt: False  # (bool) 是否将结果保存为 .txt 文件
save_conf: False  # (bool) 是否保存带置信度分数的结果
save_crop: False  # (bool) 是否保存带结果的裁剪图像
show_labels: True  # (bool) 是否显示预测标签，例如 'person'
show_conf: True  # (bool) 是否显示预测置信度，例如 '0.99'
show_boxes: True  # (bool) 是否显示预测边界框
line_width:  # (int, optional) 边界框的线宽。如果为 None，则按图像大小缩放。

# 超参数 ------------------------------------------------------------------------------------------------------
# 1. 优化器相关 (针对SSL稳定性和YOLO26特性)
lr0: 0.005          # (float) 初始学习率：从0.01降至0.005。SSL场景下高LR易导致伪标签噪声放大，引发震荡。
lrf: 0.05           # (float) 最终学习率系数：从0.01调至0.05。让学习率衰减得慢一点，利于后期在噪声数据中微调收敛。
momentum: 0.937     # (float) 动量：保持默认，SGD标准值。
weight_decay: 0.0005 # (float) 权重衰减：保持默认，防止过拟合。
warmup_epochs: 5.0  # (float) 热身周期：从3增至5。SSL初期伪标签质量差，需要更长的热身期让模型先适应有标签数据。
warmup_momentum: 0.8 # (float) 热身动量：保持默认。
warmup_bias_lr: 0.1 # (float) 热身偏置LR：保持默认。

# 2. 损失函数增益 (适配YOLO26无DFL特性)
box: 7.5            # (float) 边界框损失：保持默认。
cls: 1.0            # (float) 类别损失：从0.5提升至1.0。YOLO26是端到端模型，且移除了DFL，需要更强的分类损失来校准置信度，尤其是在伪标签存在类别噪声时。
dfl: 0.0            # (float) DFL损失：【关键修改】YOLO26架构已移除DFL模块，此参数应设为0或不生效，避免代码逻辑冲突。
label_smoothing: 0.05 # (float) 标签平滑：从0.0增至0.05。SSL中伪标签硬标签（Hard Label）噪声大，平滑能显著提高鲁棒性。

# 3. 数据增强 (针对VOC小数据集 + SSL噪声抑制)
nbs: 64             # (int) 名义Batch Size：保持默认（实际训练受限于显存，但影响权重衰减计算）。
hsv_h: 0.01         # (float) HSV色相：从0.015降至0.01。VOC类别颜色特征明显，过大扰动会破坏语义。
hsv_s: 0.4          # (float) HSV饱和度：从0.7大幅降至0.4。防止生成过于失真的图像导致伪标签失效。
hsv_v: 0.2          # (float) HSV亮度：从0.4降至0.2。同上，保持图像真实性。
degrees: 0.0        # (float) 旋转：保持0.0。VOC物体多为水平，旋转会破坏伪标签的方位一致性。
translate: 0.1      # (float) 平移：保持默认。
scale: 0.2          # (float) 缩放：从0.5大幅降至0.2。原0.5意味着0.5x~1.5x，对小目标极不友好且易导致伪标签框越界。改为0.8x~1.2x更稳妥。
shear: 0.0          # (float) 剪切：保持0.0。剪切会严重扭曲物体形状，干扰端到端模型的几何学习。
perspective: 0.0    # (float) 透视：保持0.0。
flipud: 0.0         # (float) 上下翻转：保持0.0。VOC中车、人等物体上下翻转不符合物理常识。
fliplr: 0.5         # (float) 左右翻转：保持默认，这是最安全的增强。
bgr: 0.0            # (float) BGR通道交换：保持0.0。
mosaic: 1.0         # (float) Mosaic概率：保持1.0，但在最后20个epoch自动关闭（需在训练参数设close_mosaic: 20）。
mixup: 0.0          # (float) Mixup概率：保持0.0。SSL中Mixup会导致两张图的伪标签混合，逻辑复杂且易引入噪声，建议关闭。
copy_paste: 0.0     # (float) 复制粘贴：保持0.0。
copy_paste_mode: "flip"
auto_augment: null  # (str) 自动增强：【关键修改】从randaugment改为null。RandAugment对于VOC这种小数据集过于激进，极易导致过拟合和伪标签失配。

# 4. 隐含建议 (需在训练命令中配合)
#close_mosaic: 20  #(建议在训练args中设置，提前20轮关闭Mosaic以微调)
# freeze: 11        (建议冻结Backbone前11层，保护C2PSA注意力机制)

# Export settings ------------------------------------------------------------------------------------------------------
format: torchscript  # (str) 目标格式: torchscript|onnx|openvino|engine|coreml|saved_model|tflite|etc
keras: False  # (bool) 仅TF SavedModel; 启用Keras层
optimize: False  # (bool) 仅TorchScript; 应用移动端优化
int8: False  # (bool) INT8量化 (需要校准数据)
dynamic: False  # (bool) 动态形状 (ONNX/TorchScript等)
simplify: True  # (bool) ONNX/Engine; 运行图简化器
opset:  # (int, optional) ONNX/Engine opset版本
workspace:  # (float, optional) TensorRT工作空间大小(GiB)
nms: False  # (bool) 导出时融合NMS到模型中
