# Download script/URL (optional)
# 完全使用 Python 原生库实现下载和解压
download: |
  import os
  import sys
  import urllib.request
  import zipfile
  from pathlib import Path
  from concurrent.futures import ThreadPoolExecutor

  # 配置目标路径
  TARGET_ROOT = Path("/root/autodl-tmp/coco")
  TARGET_ROOT.mkdir(parents=True, exist_ok=True)
  
  # 更新 yaml 配置中的 path，确保后续逻辑读取正确
  yaml["path"] = str(TARGET_ROOT)

  def download_file(url, destination):
      """原生方式下载文件，带简单的进度打印"""
      dest_path = Path(destination)
      if dest_path.exists():
          print(f"[Skip] File exists: {dest_path}")
          return
      
      print(f"[Start] Downloading: {url} -> {dest_path}")
      
      def reporthook(blocknum, blocksize, totalsize):
          readsofar = blocknum * blocksize
          if totalsize > 0:
              percent = readsofar * 100 / totalsize
              sys.stdout.write(f"\rProgress: {percent:.1f}%")
              sys.stdout.flush()
          else:
              sys.stdout.write(f"\rRead {readsofar} bytes")
              sys.stdout.flush()

      try:
          urllib.request.urlretrieve(url, str(dest_path), reporthook)
          print(f"\n[Done] Downloaded: {dest_path}")
      except Exception as e:
          print(f"\n[Error] Failed to download {url}: {e}")
          if dest_path.exists():
              dest_path.unlink() # 删除损坏的文件
          raise e

  def unzip_file(zip_path, extract_to):
      """原生方式解压"""
      zip_path = Path(zip_path)
      extract_to = Path(extract_to)
      extract_to.mkdir(parents=True, exist_ok=True)
      
      if not zip_path.exists():
          return

      print(f"[Start] Unzipping: {zip_path} -> {extract_to}")
      try:
          with zipfile.ZipFile(str(zip_path), 'r') as zip_ref:
              zip_ref.extractall(str(extract_to))
          print(f"[Done] Unzipped: {zip_path}")
          # 可选：解压后删除 zip 包以节省空间
          # zip_path.unlink() 
      except Exception as e:
          print(f"[Error] Failed to unzip {zip_path}: {e}")
          raise e

  # --- 1. 下载标签 (Labels) ---
  # COCO labels 通常托管在 ultralytics 的 assets 上，或者可以使用官方镜像
  # 这里使用 ultralytics 的公开 assets 链接 (如果不通，可替换为其他镜像源)
  segments = True 
  base_assets_url = "https://github.com/ultralytics/assets/releases/download/v0.0.0"
  # 注意：上面的 v0.0.0 是占位符，实际 ultralytics 使用的是动态生成的 ASSETS_URL。
  # 为了确保原生代码能跑，我们直接使用已知的稳定链接或尝试构建。
  # 更稳妥的方式是使用官方 coco 网站提供的 labels 或者 ultralytics 的具体 release 链接。
  # 经过检索，COCO2017 labels 的稳定下载地址如下：
  label_url = "https://github.com/ultralytics/assets/releases/download/v8.1.0/coco2017labels-segments.zip" if segments else "https://github.com/ultralytics/assets/releases/download/v8.1.0/coco2017labels.zip"
  
  # 如果上述 github 链接不可用，备用方案是直接下载到 root，因为 coco labels zip 结构通常是直接包含 train2017/, val2017/ 文件夹
  try:
      zip_name = "coco2017labels-segments.zip" if segments else "coco2017labels.zip"
      local_zip = TARGET_ROOT / zip_name
      download_file(label_url, local_zip)
      unzip_file(local_zip, TARGET_ROOT)
  except Exception as e:
      print(f"Label download failed: {e}. Please check network or URL.")

  # --- 2. 下载图片 (Images) ---
  image_urls = [
      "http://images.cocodataset.org/zips/train2017.zip",
      "http://images.cocodataset.org/zips/val2017.zip",
      # "http://images.cocodataset.org/zips/test2017.zip" # 通常训练不需要 test 集，如需可取消注释
  ]
  
  images_dir = TARGET_ROOT / "images"
  images_dir.mkdir(parents=True, exist_ok=True)

  def process_image_download(url):
      filename = url.split("/")[-1]
      local_zip = images_dir / filename
      download_file(url, local_zip)
      unzip_file(local_zip, images_dir)

  # 使用线程池并发下载图片 (模拟原 threads=3 的行为)
  # 注意：COCO 图片非常大，并发下载可能受限于带宽，但能充分利用连接
  with ThreadPoolExecutor(max_workers=3) as executor:
      executor.map(process_image_download, image_urls)

  print("\n[Success] COCO dataset preparation complete at: /root/autodl-tmp/coco")