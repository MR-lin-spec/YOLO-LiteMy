# voc.yaml
# 数据集根目录：当前所在目录 (~/autodl-tmp/YOLO2012)
# 使用 "." 代表当前目录，或者填写绝对路径 "/root/autodl-tmp/YOLO2012"
path: /root/autodl-tmp/YOLO2007

# 训练集和验证集路径 (相对于 path)
# 注意：请根据实际文件夹内部结构调整。
# 如果 train 文件夹下直接是图片 (xxx.jpg)，请将 "train/images" 改为 "train"
# 如果 train 文件夹下有 images 子文件夹 (train/images/xxx.jpg)，则保持 "train/images"
train: train/images  
val: val/images
# test: test/images  # 如果需要测试集

# 类别数量
nc: 20
 
# 类别名称 (必须全小写，与 transform.py 一致)
names:
  0: aeroplane
  1: bicycle
  2: boat
  3: bus
  4: car
  5: motorbike
  6: train
  7: bottle
  8: chair
  9: diningtable
  10: pottedplant
  11: sofa
  12: tvmonitor
  13: bird
  14: cat
  15: cow
  16: dog
  17: horse
  18: sheep
  19: person